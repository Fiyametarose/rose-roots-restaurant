plugins {
    id 'application'
}

apply from: rootProject.file('gradle/javafx-desktop.gradle')

application {
    mainModule = 'com.roseroots.kitchen'
    mainClass = 'com.roseroots.kitchen.app.KitchenApplication'
}

tasks.named('processResources') {
    from(project(':customer').layout.projectDirectory.file('src/main/resources/styles/components.css')) {
        into 'styles'
    }
}
