plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
}
tasks.named('processResources') {
    from(project(':customer').layout.projectDirectory.file('src/main/resources/images/rose-mark.png')) {
        into 'branding'
    }
}
dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(path: ':kitchen-app', configuration: 'runtimeElements')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def postgresIntegrationEnabled = providers.environmentVariable('ROSE_TEST_DB_URL').map { true }.orElse(false)
test {
    inputs.property('postgresIntegrationEnabled', postgresIntegrationEnabled)
    outputs.upToDateWhen { !postgresIntegrationEnabled.get() }
}

def customerCheckout = providers.gradleProperty('customerCheckout')
        .map { rootProject.file(it) }.orElse(project(':customer').layout.projectDirectory.asFile)
def catalogMode = providers.gradleProperty('catalogMode').orElse('dry-run')
sourceSets {
    customerCatalogImport {
        java.srcDir(customerCheckout.map { new File(it, 'src/main/java') })
        java.include 'com/roseroots/server/catalog/CustomerCatalogImportMain.java',
                'com/roseroots/customer/models/LocalizedText.java',
                'com/roseroots/customer/models/MenuCategory.java',
                'com/roseroots/customer/models/MenuItem.java',
                'com/roseroots/customer/models/MenuCatalog.java',
                'com/roseroots/customer/services/MenuService.java',
                'com/roseroots/customer/services/mock/MockMenuService.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    customerCatalogImportImplementation.extendsFrom(implementation)
    customerCatalogImportRuntimeOnly.extendsFrom(runtimeOnly)
}
tasks.named('compileCustomerCatalogImportJava', JavaCompile) {
    modularity.inferModulePath = false
    options.encoding = 'UTF-8'
    options.sourcepath = files(layout.buildDirectory.dir('import-sourcepath'))
}
tasks.register('importCustomerCatalog', JavaExec) {
    group = 'application'
    description = 'Validate or import the catalog from the Customer project or an explicitly selected checkout.'
    classpath = sourceSets.customerCatalogImport.runtimeClasspath
    mainClass = 'com.roseroots.server.catalog.CustomerCatalogImportMain'
    modularity.inferModulePath = false
    doFirst {
        args customerCheckout.get().absolutePath, catalogMode.get()
    }
}
