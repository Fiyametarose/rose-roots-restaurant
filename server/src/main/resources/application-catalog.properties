spring.autoconfigure.exclude=
spring.datasource.url=${ROSE_DB_URL}
spring.datasource.username=${ROSE_DB_USERNAME}
spring.datasource.password=${ROSE_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
